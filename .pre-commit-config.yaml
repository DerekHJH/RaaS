repos:
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
    - id: black
      files: benchmarks/

  - repo: https://github.com/PyCQA/flake8
    rev: 7.1.1
    hooks:
    - id: flake8
      files: benchmarks/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: benchmarks/

  - repo: https://github.com/pre-commit/mirrors-isort
    rev: v5.10.1
    hooks:
      - id: isort
        files: benchmarks/